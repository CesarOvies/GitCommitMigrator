name: CI & PR Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-policy:
    name: Validate PR Branch Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Gitflow PR Target & Source Rules
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;

            let errorMessage = null;

            if (base === 'main' && head !== 'develop') {
              errorMessage = `❌ **Regra de Branch Violada**: A branch \`main\` só aceita Pull Requests vindos de \`develop\` (atual: \`${head}\` -> \`${base}\`). Redirecione seu PR para \`develop\`.`;
            } else if (base !== 'main' && base !== 'develop') {
              errorMessage = `❌ **Regra de Branch Violada**: Pull Requests devem ser direcionados para \`develop\` (ou \`develop\` -> \`main\`). Alvo inválido: \`${base}\`.`;
            }

            if (errorMessage) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: errorMessage
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });

              core.setFailed(errorMessage);
            } else {
              core.info(`✅ Fluxo de branch válido: ${head} -> ${base}`);
            }

  build-and-test:
    name: Build & Test (.NET 8 Windows)
    needs: [branch-policy]
    if: always() && (github.event_name == 'push' || needs.branch-policy.result == 'success')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore GitCommitMigration.slnx

      - name: Build solution
        run: dotnet build GitCommitMigration.slnx -c Release --no-restore

      - name: Run unit & integration tests
        id: tests
        run: dotnet test GitCommitMigration.slnx -c Release --no-build --verbosity normal

      - name: Auto-close PR if tests fail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const message = `❌ **PR Fechado Automaticamente**: Os testes/build falharam. Todos os testes precisam passar para manter um Pull Request aberto ou aceito.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });

  auto-pr-to-main:
    name: Auto-create PR (develop -> main)
    needs: [build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR from develop to main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: 'main...develop'
            });

            if (comparison.ahead_by === 0) {
              core.info('ℹ️ A branch develop não possui novos commits à frente da main. Nenhum PR necessário.');
              return;
            }

            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:develop`
            });

            const commitSummary = comparison.commits
              .map(c => `- ${c.commit.message.split('\n')[0]} (\`${c.sha.substring(0, 7)}\`)`)
              .join('\n');

            const body = [
              '## 🚀 Promoção Automática: `develop` → `main`',
              '',
              'PR gerado automaticamente após aprovação/merge na `develop` e validação no CI.',
              '',
              '### 📋 Commits incluídos:',
              commitSummary
            ].join('\n');

            if (openPrs.length > 0) {
              const existingPr = openPrs[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPr.number,
                body
              });
              core.info(`✅ PR existente #${existingPr.number} atualizado: ${existingPr.html_url}`);
            } else {
              const { data: newPr } = await github.rest.pulls.create({
                owner,
                repo,
                title: 'chore(release): promote develop to main',
                head: 'develop',
                base: 'main',
                body
              });
              core.info(`✅ PR criado automaticamente #${newPr.number}: ${newPr.html_url}`);
            }

