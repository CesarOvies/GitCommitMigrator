name: CI & PR Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-policy:
    name: Validate PR Branch Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Gitflow PR Target & Source Rules
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;

            let errorMessage = null;

            if (base === 'main' && head !== 'develop') {
              errorMessage = `❌ **Regra de Branch Violada**: A branch \`main\` só aceita Pull Requests vindos de \`develop\` (atual: \`${head}\` -> \`${base}\`). Redirecione seu PR para \`develop\`.`;
            } else if (base !== 'main' && base !== 'develop') {
              errorMessage = `❌ **Regra de Branch Violada**: Pull Requests devem ser direcionados para \`develop\` (ou \`develop\` -> \`main\`). Alvo inválido: \`${base}\`.`;
            }

            if (errorMessage) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: errorMessage
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });

              core.setFailed(errorMessage);
            } else {
              core.info(`✅ Fluxo de branch válido: ${head} -> ${base}`);
            }

  build-and-test:
    name: Build & Test (.NET 8 Windows)
    needs: [branch-policy]
    if: always() && (github.event_name == 'push' || needs.branch-policy.result == 'success')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore GitCommitMigration.slnx

      - name: Build solution
        run: dotnet build GitCommitMigration.slnx -c Release --no-restore

      - name: Run unit & integration tests
        id: tests
        run: dotnet test GitCommitMigration.slnx -c Release --no-build --verbosity normal

      - name: Auto-close PR if tests fail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const message = `❌ **PR Fechado Automaticamente**: Os testes/build falharam. Todos os testes precisam passar para manter um Pull Request aberto ou aceito.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });

  build-and-test-web:
    name: Build & Test Web (Node.js)
    needs: [branch-policy]
    if: always() && (github.event_name == 'push' || needs.branch-policy.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Migrator.Web/package-lock.json

      - name: Install dependencies
        working-directory: Migrator.Web
        run: npm ci

      - name: Run web tests
        working-directory: Migrator.Web
        run: npm run test

      - name: Build web application
        working-directory: Migrator.Web
        run: npm run build

      - name: Auto-close PR if web build/tests fail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const message = `❌ **PR Fechado Automaticamente**: O build ou testes da versão Web falharam.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });

